formatVersion: 1
defaultProject: calc

servers:
  jenkins-conf: CI сборки и деплоя calc
  jira-corp: задачи Jira
  confluence-corp: документация и runbook'и
  bitbucket-corp: репозитории и PR
  sonar-corp: качество и уязвимости
  mapp-team: схемы и знания

projects:
  - projectKey: calc
    jiraProjectKey: PRJ
    repoSshUrl: git@git.corp:team/calc.git
    artifactId: CALC-APP
    defaultBranch: main
    branchPrefix: { task: feature, bug: bugfix }
    description: Калькулятор, длинные сборки
    limits: { maxRuns: 3, maxRetries: 1, maxFixAttempts: 2, totalRunBudget: 90 }
    errorPolicy: { unfixableCategories: [infra, sonar] }
    pipelineOrder: [do, build, deploy]
    stages:
      - id: do
        kind: DO
        knowledgeRef: do-context
        pullRequestOwner: courier
      - id: build
        kind: BUILD
        knowledgeRef: build-ci
        diagnosisRef: build-diagnosis
        limits: { maxRuns: 3 }
      - id: deploy
        kind: DEPLOY
        knowledgeRef: deploy-cd
        diagnosisRef: deploy-diagnosis
        limits: { maxRuns: 2 }
      - id: fixDo
        kind: FIX_DO
        knowledgeRef: fixdo-context
        nextStageId: do
        fixesStageId: do
        triggeredBy: pullRequestReview
        pullRequestOwner: courier
      - id: fixBuild
        kind: FIX_BUILD
        knowledgeRef: fixbuild-ci
        repairRef: fixbuild-repair
        nextStageId: build
        fixesStageId: build
        pullRequestOwner: courier
      - id: fixDeploy
        kind: FIX_DEPLOY
        knowledgeRef: fixdeploy-cd
        repairRef: fixdeploy-repair
        nextStageId: build
        fixesStageId: deploy
        pullRequestOwner: courier
    knowledge:
      - id: do-context
        endpoints:
          - { alias: MCP_JIRA, serverId: jira-corp }
          - { alias: MCP_CONFLUENCE, serverId: confluence-corp }
          - { alias: MCP_MAPP, serverId: mapp-team }
          - { alias: MCP_BITBUCKET, serverId: bitbucket-corp }
      - id: build-ci
        endpoints:
          - alias: MCP_BUILD
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app
      - id: build-diagnosis
        endpoints:
          - alias: MCP_BUILD
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app
          - { alias: MCP_SONAR, serverId: sonar-corp, projectKey: corp-calc }
          - { alias: MCP_JIRA, serverId: jira-corp }
          - { alias: MCP_CONFLUENCE, serverId: confluence-corp }
      - id: deploy-cd
        endpoints:
          - alias: MCP_DEPLOY
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app-deploy
            environments: [DEV, ST, IFT, PSI]
            environmentJobNames: { IFT: calc-app-deploy-ift }
      - id: deploy-diagnosis
        endpoints:
          - alias: MCP_DEPLOY
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app-deploy
            environments: [DEV, ST, IFT, PSI]
          - { alias: MCP_JIRA, serverId: jira-corp }
          - { alias: MCP_CONFLUENCE, serverId: confluence-corp }
      - id: fixdo-context
        endpoints:
          - { alias: MCP_JIRA, serverId: jira-corp }
          - { alias: MCP_CONFLUENCE, serverId: confluence-corp }
          - { alias: MCP_BITBUCKET, serverId: bitbucket-corp }
      - id: fixbuild-ci
        endpoints:
          - alias: MCP_BUILD
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app-ci
            jobParameters: { SKIP_TESTS: "true", MODE: fast }
          - { alias: MCP_SONAR, serverId: sonar-corp, projectKey: corp-calc }
          - { alias: MCP_JIRA, serverId: jira-corp }
          - { alias: MCP_BITBUCKET, serverId: bitbucket-corp }
      - id: fixdeploy-cd
        endpoints:
          - alias: MCP_DEPLOY
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app-deploy
            environments: [DEV, ST, IFT, PSI]
          - { alias: MCP_JIRA, serverId: jira-corp }
          - { alias: MCP_BITBUCKET, serverId: bitbucket-corp }
      - id: fixbuild-repair
        endpoints:
          - alias: MCP_BUILD
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app
      - id: fixdeploy-repair
        endpoints:
          - alias: MCP_DEPLOY
            serverId: jenkins-conf
            runnerKind: JENKINS
            jobFolder: folder/team
            jobName: calc-app-deploy
            environments: [DEV, ST, IFT, PSI]
            environmentJobNames: { IFT: calc-app-deploy-ift }
